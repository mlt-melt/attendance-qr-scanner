<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Сканер посещаемости</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
    :root {
        color-scheme: dark;
        --bg: #081119;
        --panel: #101e29;
        --panel-light: #172a37;
        --line: #294252;
        --text: #f1f8fb;
        --muted: #a7bbc7;
        --accent: #65e6b0;
        --warn: #ff9076;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; min-height: 100%; }

    body {
        margin: 0;
        overflow: hidden;
        background: radial-gradient(circle at 50% -20%, #204356, transparent 55%), var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
    }

    button, select, input { font: inherit; }

    .app {
        width: min(100%, 760px);
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        margin: 0 auto;
        padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
    }

    .eyebrow {
        margin: 0 0 2px;
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .12em;
        text-transform: uppercase;
    }

    .title { margin: 0; font-size: clamp(21px, 5vw, 28px); line-height: 1.15; }

    .connectivity { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

    .service-indicator {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: var(--panel);
        font-size: 12px;
        white-space: nowrap;
    }

    .service-indicator strong { flex: none; font-weight: 650; }
    .service-indicator span:last-child { overflow: hidden; text-overflow: ellipsis; color: var(--muted); }

    .dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--muted); }
    .online .dot, .success .dot { background: var(--accent); }
    .offline .dot, .error .dot { background: var(--warn); }
    .checking .dot, .loading .dot { background: #8bdfff; animation: pulse 1.4s infinite; }

    .reader-card, .results-card, .participants {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
        box-shadow: 0 16px 44px #0004;
    }

    .reader-card {
        min-height: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 10px;
    }

    .participants { padding: 8px 10px; min-height: 0; }
    .participants summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; list-style: none; font-size: 13px; font-weight: 650; }
    .participants summary::-webkit-details-marker { display: none; }
    .participants summary::after { content: "⌄"; color: var(--muted); font-size: 18px; line-height: 1; transition: transform .15s; }
    .participants[open] summary::after { transform: rotate(180deg); }
    .participants-count { color: var(--accent); font-variant-numeric: tabular-nums; }
    .participants-list { display: grid; gap: 1px; max-height: 118px; overflow: auto; margin-top: 7px; padding-top: 4px; border-top: 1px solid var(--line); scrollbar-width: thin; }
    .participant { display: flex; align-items: center; gap: 7px; min-width: 0; padding: 4px 1px; font-size: 12px; }
    .participant .dot { width: 7px; height: 7px; }
    .participant.ready .dot { background: var(--accent); }
    .participant.unauthorized .dot, .participant.forbidden .dot { background: var(--warn); }
    .participant-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .participant-state { color: var(--muted); white-space: nowrap; }
    .participant.ready .participant-state { color: var(--accent); }
    .participant.unauthorized .participant-state, .participant.forbidden .participant-state { color: var(--warn); }

    .status {
        min-height: 38px;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 4px;
        color: var(--muted);
        font-size: 13px;
    }

    .status.success { color: var(--accent); }
    .status.error { color: var(--warn); }
    .status .dot { width: 9px; height: 9px; }

    .camera-frame {
        position: relative;
        min-height: 0;
        flex: 1;
        overflow: hidden;
        touch-action: none;
        border: 1px solid #324451;
        border-radius: 14px;
        background: #03080c;
    }

    #reader {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    #reader video {
        width: auto !important;
        height: auto !important;
        max-width: 100% !important;
        max-height: 100% !important;
        object-fit: contain;
    }

    .camera-placeholder, .camera-guide { position: absolute; inset: 0; pointer-events: none; }

    .camera-placeholder {
        display: grid;
        place-content: center;
        gap: 8px;
        padding: 20px;
        text-align: center;
        color: var(--muted);
    }

    .camera-placeholder span:first-child { font-size: 34px; color: var(--accent); line-height: 1; }
    .camera-frame.is-active .camera-placeholder { display: none; }
    .camera-guide { display: none; place-items: center; }
    .camera-frame.is-active .camera-guide { display: grid; }

    .guide-box {
        width: min(57%, 230px);
        aspect-ratio: 1;
        border: 2px solid #a2ffd6d6;
        border-radius: 18px;
        box-shadow: 0 0 0 999px #020b1040, 0 0 22px #65e6b03c;
    }

    .controls { display: grid; gap: 7px; }
    .control-row { display: flex; align-items: center; gap: 8px; min-width: 0; }

    .action-button, .camera-select {
        min-width: 0;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: var(--panel-light);
        color: var(--text);
        cursor: pointer;
        text-align: center;
    }

    .action-button:hover:not(:disabled), .camera-select:hover { border-color: var(--accent); }
    .action-button:focus-visible, .camera-select:focus-visible, .zoom-slider:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .action-button:disabled { opacity: .48; cursor: default; }
    .icon-button { display: grid; place-items: center; width: 38px; min-width: 38px; height: 38px; min-height: 38px; padding: 0; }
    .icon-button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .camera-select { width: 100%; padding: 0 9px; text-align: left; font-size: 12px; }
    .camera-select[hidden] { display: none; }

    .zoom-control {
        min-width: 0;
        flex: 1;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 4px;
    }

    .zoom-slider { min-width: 0; flex: 1; height: 24px; margin: 0; accent-color: var(--accent); cursor: pointer; }
    .zoom-slider:disabled { opacity: .4; cursor: default; }
    .zoom-value { min-width: 34px; text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }
    .zoom-control.is-disabled .zoom-value { color: var(--muted); }

    .results-card { display: none; padding: 12px; }
    .results-card.visible { display: block; }
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
    .summary-item { padding: 10px; border: 1px solid var(--line); border-radius: 11px; text-align: center; }
    .summary-item strong { display: block; font-size: 22px; }
    .summary-item span { color: var(--muted); font-size: 12px; }
    .items { display: grid; gap: 8px; list-style: none; margin: 0; padding: 0; }
    .item { padding: 10px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel-light); }
    .item-header { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 5px; font-size: 13px; }
    .item-result { margin: 0; color: var(--muted); font-size: 13px; }

    .results-mode { overflow: auto; }
    .results-mode .app { height: auto; min-height: 100vh; min-height: 100dvh; }
    .results-mode .reader-card { flex: none; }
    .results-mode .camera-frame, .results-mode .controls { display: none; }

    [hidden] { display: none !important; }

    @keyframes pulse { 50% { box-shadow: 0 0 0 5px #8bdfff30; } }

    @media (max-height: 630px) {
        .app { gap: 7px; padding-top: 8px; padding-bottom: 8px; }
        .reader-card { gap: 6px; padding: 7px; }
        .status { min-height: 30px; }
        .participants-list { max-height: 74px; }
    }

    @media (max-width: 380px) {
        .title { font-size: 20px; }
        .service-indicator { padding: 7px; font-size: 11px; }
    }
</style>
</head>

<body>
    <main class="app">
        <header class="topbar">
            <div>
                <p class="eyebrow">Посещаемость</p>
                <h1 class="title">Сканер QR-кода</h1>
            </div>
        </header>

        <section class="connectivity" aria-label="Доступность серверов">
            <div class="service-indicator checking" id="botApiIndicator" role="status" aria-live="polite">
                <span class="dot" aria-hidden="true"></span>
                <strong>Сервер</strong>
                <span id="botApiState">Проверяем...</span>
            </div>
            <div class="service-indicator checking" id="pulseApiIndicator" role="status" aria-live="polite">
                <span class="dot" aria-hidden="true"></span>
                <strong>Пульс</strong>
                <span id="pulseApiState">Проверяем...</span>
            </div>
        </section>

        <details class="participants" id="participants">
            <summary><span>Студенты</span><span class="participants-count" id="participantsCount">Проверяем...</span></summary>
            <div class="participants-list" id="participantsList" aria-live="polite"></div>
        </details>

        <section class="reader-card">
            <div class="status" id="statusBox" role="status" aria-live="polite">
                <span class="dot" aria-hidden="true"></span>
                <span id="statusText">Подключаем камеру...</span>
            </div>
            <div class="camera-frame" id="cameraFrame">
                <div id="reader"></div>
                <div class="camera-placeholder" id="cameraPlaceholder"><span>⌗</span><span>Камера ещё не включена</span></div>
                <div class="camera-guide" aria-hidden="true"><div class="guide-box"></div></div>
            </div>
            <div class="controls">
                <div class="control-row">
                    <button class="action-button icon-button" id="cameraButton" type="button" aria-label="Перезапустить камеру" title="Перезапустить камеру"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 1-2.3-5.7"/><path d="M20 4v6h-6"/></svg></button>
                    <button class="action-button icon-button" id="photoButton" type="button" aria-label="Загрузить фото QR" title="Загрузить фото QR"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m3 17 5-5 4 4 3-3 6 6"/></svg></button>
                    <div class="zoom-control is-disabled" id="zoomControl">
                        <input class="zoom-slider" id="zoomSlider" type="range" min="1" max="2" step="0.1" value="1" aria-label="Приближение" disabled>
                        <output class="zoom-value" id="zoomValue" for="zoomSlider">—</output>
                    </div>
                </div>
                <select class="camera-select" id="cameraSelect" aria-label="Выбор камеры" hidden></select>
            </div>
            <input id="photoInput" type="file" accept="image/*" hidden>
        </section>

        <section class="results-card" id="resultsCard">
            <div class="summary-grid">
                <div class="summary-item">
                    <strong id="totalValue">0</strong>
                    <span>Всего</span>
                </div>
                <div class="summary-item">
                    <strong id="successValue">0</strong>
                    <span>Успешно</span>
                </div>
                <div class="summary-item">
                    <strong id="failedValue">0</strong>
                    <span>Ошибок</span>
                </div>
            </div>
            <ul class="items" id="itemsList"></ul>
        </section>
    </main>

    <script>
        const tg = window.Telegram?.WebApp;
        const hasTelegramBridge = Boolean(window.TelegramWebviewProxy || window.Telegram?.WebView);
        const hasInitData = Boolean(typeof tg?.initData === "string" && tg.initData.trim().length > 0);
        const isTelegramWebApp = Boolean(
            tg &&
            typeof tg.sendData === "function" &&
            typeof tg.close === "function" &&
            (hasInitData || hasTelegramBridge)
        );

        if (isTelegramWebApp) {
            tg.expand();
        }

        const studentsIdsRaw = new URLSearchParams(window.location.search).get("students_ids");
        const studentIds = studentsIdsRaw
            ? studentsIdsRaw.split(",").map((id) => Number(id.trim())).filter((id) => Number.isFinite(id))
            : [];
        const apiBaseUrl = "https://mirea-bot.latyshov.space";
        const botHealthIntervalMs = 2000;
        const pulseHealthIntervalMs = 10000;

        const statusBox = document.getElementById("statusBox");
        const statusText = document.getElementById("statusText");
        const botApiIndicator = document.getElementById("botApiIndicator");
        const botApiState = document.getElementById("botApiState");
        const pulseApiIndicator = document.getElementById("pulseApiIndicator");
        const pulseApiState = document.getElementById("pulseApiState");
        const participantsCount = document.getElementById("participantsCount");
        const participantsList = document.getElementById("participantsList");
        const resultsCard = document.getElementById("resultsCard");
        const totalValue = document.getElementById("totalValue");
        const successValue = document.getElementById("successValue");
        const failedValue = document.getElementById("failedValue");
        const itemsList = document.getElementById("itemsList");
        const cameraFrame = document.getElementById("cameraFrame");
        const cameraPlaceholder = document.getElementById("cameraPlaceholder");
        const cameraButton = document.getElementById("cameraButton");
        const photoButton = document.getElementById("photoButton");
        const photoInput = document.getElementById("photoInput");
        const cameraSelect = document.getElementById("cameraSelect");
        const zoomControl = document.getElementById("zoomControl");
        const zoomSlider = document.getElementById("zoomSlider");
        const zoomValue = document.getElementById("zoomValue");

        let isSubmitting = false;
        let approvalPending = false;
        let scanner;
        let cameraRunning = false;
        let cameraTransition = Promise.resolve();
        let currentZoom = 1;
        let pendingZoom = null;
        let zoomTask = null;
        let pinchStart = null;
        let botCheckPromise = null;
        let pulseCheckPromise = null;
        let readinessPromise = null;

        function setStatus(type, text) {
            statusBox.className = `status ${type}`.trim();
            statusText.textContent = text;
            statusBox.hidden = !text;
        }

        function renderReadiness(items) {
            const labels = {
                ready: "готов",
                unauthorized: "нет входа",
                forbidden: "отметка запрещена",
                unavailable: "не удалось проверить",
                not_found: "не найден",
            };
            participantsList.replaceChildren();
            items.forEach((item) => {
                const row = document.createElement("div");
                row.className = `participant ${item.status}`;
                const dot = document.createElement("span");
                dot.className = "dot";
                dot.setAttribute("aria-hidden", "true");
                const name = document.createElement("span");
                name.className = "participant-name";
                name.textContent = item.login || `#${item.student_id}`;
                const state = document.createElement("span");
                state.className = "participant-state";
                state.textContent = labels[item.status] || "неизвестно";
                row.append(dot, name, state);
                participantsList.appendChild(row);
            });
            const readyCount = items.filter((item) => item.status === "ready").length;
            const unknownCount = items.filter((item) => item.status === "unavailable").length;
            participantsCount.textContent = `${readyCount} из ${studentIds.length} готовы${unknownCount ? ` · ${unknownCount} не проверены` : ""}`;
        }

        function refreshReadiness() {
            if (readinessPromise) return readinessPromise;
            if (isSubmitting) return Promise.resolve();
            if (!studentIds.length) {
                participantsCount.textContent = "Нет студентов";
                return Promise.resolve();
            }
            readinessPromise = (async () => {
                const controller = new AbortController();
                const timeoutMs = Math.max(15000, Math.ceil(studentIds.length / 6) * 9000 + 3000);
                const timeout = setTimeout(() => controller.abort(), timeoutMs);
                try {
                    const response = await fetch(`${apiBaseUrl}/api/attendance/readiness`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ student_ids: studentIds }),
                        cache: "no-store",
                        signal: controller.signal,
                    });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    renderReadiness(data.items || []);
                } catch (error) {
                    console.warn("Readiness check failed", error);
                    renderReadiness(studentIds.map((id) => ({ student_id: id, status: "unavailable" })));
                } finally {
                    clearTimeout(timeout);
                }
            })().finally(() => { readinessPromise = null; });
            return readinessPromise;
        }

        function setServiceStatus(indicator, stateElement, state, text) {
            if (indicator.className === `service-indicator ${state}` && stateElement.textContent === text) {
                return;
            }
            indicator.className = `service-indicator ${state}`;
            stateElement.textContent = text;
        }

        async function fetchHealth(path, timeoutMs) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const response = await fetch(`${apiBaseUrl}${path}`, {
                    cache: "no-store",
                    signal: controller.signal,
                });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                return await response.json();
            } finally {
                clearTimeout(timeout);
            }
        }

        function checkBotApi() {
            if (botCheckPromise) {
                return botCheckPromise;
            }
            botCheckPromise = (async () => {
                let botOnline = false;
                try {
                    botOnline = (await fetchHealth("/health", 1500))?.status === "ok";
                } catch (_) {
                    // The indicator below shows a network error or timeout.
                }
                setServiceStatus(
                    botApiIndicator, botApiState,
                    botOnline ? (approvalPending ? "checking" : "online") : "offline",
                    botOnline ? (approvalPending ? "отметка выполняется..." : "в сети") : "не отвечает"
                );
            })().finally(() => {
                botCheckPromise = null;
            });
            return botCheckPromise;
        }

        function checkPulseApi(force = false) {
            if (pulseCheckPromise) {
                return force ? pulseCheckPromise.then(() => checkPulseApi(true)) : pulseCheckPromise;
            }
            pulseCheckPromise = (async () => {
                let status;
                try {
                    status = (await fetchHealth(
                        `/api/attendance/pulse-health${force ? "?force=true" : ""}`,
                        6000
                    ))?.status;
                } catch (_) {
                    // Pulse cannot be diagnosed if the proxy request failed.
                }
                if (status === "online") {
                    setServiceStatus(pulseApiIndicator, pulseApiState, "online", "в сети");
                } else if (status === "offline") {
                    setServiceStatus(pulseApiIndicator, pulseApiState, "offline", "не отвечает");
                } else {
                    setServiceStatus(pulseApiIndicator, pulseApiState, "unknown", "не удалось проверить");
                }
            })().finally(() => {
                pulseCheckPromise = null;
            });
            return pulseCheckPromise;
        }

        function refreshConnectivity(force = false) {
            return Promise.all([checkBotApi(), checkPulseApi(force)]);
        }

        refreshConnectivity();
        refreshReadiness();
        const botHealthTimer = setInterval(checkBotApi, botHealthIntervalMs);
        const pulseHealthTimer = setInterval(checkPulseApi, pulseHealthIntervalMs);
        const readinessTimer = setInterval(refreshReadiness, 60000);
        window.addEventListener("pagehide", () => {
            clearInterval(botHealthTimer);
            clearInterval(pulseHealthTimer);
            clearInterval(readinessTimer);
            if (cameraRunning) {
                scanner.stop().catch(() => {});
            }
        });

        function getTokenFromQr(decodedText) {
            try {
                const qrUrl = new URL(decodedText);
                return qrUrl.searchParams.get("token");
            } catch (_) {
                const parts = decodedText.split("token=");
                return parts.length > 1 ? parts[1].split("&")[0] : null;
            }
        }

        function renderResults(responseData) {
            const items = Array.isArray(responseData?.items) ? responseData.items : [];
            const successCount = typeof responseData?.success_count === "number"
                ? responseData.success_count
                : items.filter((item) => String(item?.result || "").includes("Студент успешно отмечен")).length;
            const totalCount = typeof responseData?.total === "number" ? responseData.total : items.length;
            const failedCount = typeof responseData?.failed_count === "number" ? responseData.failed_count : Math.max(totalCount - successCount, 0);

            totalValue.textContent = String(totalCount);
            successValue.textContent = String(successCount);
            failedValue.textContent = String(failedCount);

            itemsList.innerHTML = "";
            items.forEach((item, index) => {
                const li = document.createElement("li");
                li.className = "item";
                li.style.animationDelay = `${Math.min(index * 35, 360)}ms`;

                const login = item?.login || `student_id=${item?.student_id ?? "?"}`;
                const result = item?.result || "Нет данных";

                li.innerHTML = `
                    <div class="item-header">
                        <strong>${login}</strong>
                        <span>#${item?.student_id ?? "?"}</span>
                    </div>
                    <p class="item-result">${result}</p>
                `;
                itemsList.appendChild(li);
            });

            resultsCard.classList.add("visible");

            document.body.classList.add("results-mode");
        }

        async function onScanSuccess(decodedText) {
            if (isSubmitting) {
                return;
            }

            if (!decodedText.includes("pulse.mirea.ru/lessons/visiting-logs/selfapprove?token=")) {
                return;
            }

            const token = getTokenFromQr(decodedText);
            if (!token) {
                setStatus("error", "Не удалось получить token из QR-кода");
                return;
            }

            if (!studentIds.length) {
                setStatus("error", "В URL нет корректного students_ids");
                return;
            }

            isSubmitting = true;
            approvalPending = true;
            setStatus("loading", "Отправляю запрос на сервер...");
            setServiceStatus(botApiIndicator, botApiState, "checking", "отправка отметки...");
            refreshConnectivity(true);

            let approvalTimeout;
            const approvalTimeoutMs = Math.max(45000, Math.ceil(studentIds.length / 6) * 15000 + 5000);
            let approvalResponseReceived = false;
            try {
                await stopCamera();

                const approvalController = new AbortController();
                approvalTimeout = setTimeout(() => approvalController.abort(), approvalTimeoutMs);
                const response = await fetch(`${apiBaseUrl}/api/attendance/approve`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    signal: approvalController.signal,
                    body: JSON.stringify({
                        token: token,
                        student_ids: studentIds,
                        shuffle: true,
                        notify_success: !isTelegramWebApp,
                    }),
                });
                approvalResponseReceived = true;
                approvalPending = false;
                setServiceStatus(botApiIndicator, botApiState, "online", "в сети");

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Attendance API ${response.status}: ${errorText}`);
                }

                const responseData = await response.json();
                const resultItems = Array.isArray(responseData?.items) ? responseData.items : [];

                if (isTelegramWebApp) {
                    tg.sendData(JSON.stringify(resultItems));
                }

                renderResults(responseData);
                if (responseData.failed_count > 0) {
                    setStatus("error", `Отмечено ${responseData.success_count} из ${responseData.total}. Подробности ниже`);
                } else {
                    setStatus("success", isTelegramWebApp ? "Результаты отправлены и показаны" : "Готово: результаты показаны ниже");
                }

                if (isTelegramWebApp) {
                    tg.close();
                }
            } catch (error) {
                approvalPending = false;
                console.error("Failed to send attendance request", error);

                if (!approvalResponseReceived) {
                    setServiceStatus(botApiIndicator, botApiState, "offline", "не ответил на отметку");
                    setServiceStatus(pulseApiIndicator, pulseApiState, "unknown", "не удалось проверить");
                }

                if (isTelegramWebApp) {
                    tg.sendData(JSON.stringify([]));
                }

                const errorText = error?.name === "AbortError"
                    ? `Наш API не ответил за ${Math.round(approvalTimeoutMs / 1000)} секунд`
                    : approvalResponseReceived
                        ? "Наш API ответил ошибкой при отметке"
                        : "Нет связи с нашим API";
                setStatus("error", errorText);
                renderResults({ total: 0, success_count: 0, failed_count: 0, items: [] });

                if (isTelegramWebApp) {
                    tg.close();
                }
            } finally {
                clearTimeout(approvalTimeout);
            }
        }

        function queueCameraAction(action) {
            const next = cameraTransition.catch(() => {}).then(action);
            cameraTransition = next;
            return next;
        }

        function resetCameraControls() {
            pendingZoom = null;
            pinchStart = null;
            zoomSlider.disabled = true;
            zoomValue.textContent = "—";
            zoomControl.classList.add("is-disabled");
            zoomControl.title = "Приближение недоступно для этой камеры";
        }

        function configureCameraControls() {
            resetCameraControls();
            try {
                const zoom = scanner.getRunningTrackCapabilities().zoom;
                if (zoom && Number.isFinite(zoom.min) && Number.isFinite(zoom.max) && zoom.max > zoom.min) {
                    const settings = scanner.getRunningTrackSettings();
                    currentZoom = Math.min(zoom.max, Math.max(zoom.min, Number(settings.zoom) || zoom.min));
                    zoomSlider.min = String(zoom.min);
                    zoomSlider.max = String(zoom.max);
                    zoomSlider.step = String(Number.isFinite(zoom.step) && zoom.step > 0 ? zoom.step : 0.1);
                    zoomSlider.value = String(currentZoom);
                    zoomValue.textContent = `${currentZoom.toFixed(1)}×`;
                    zoomSlider.disabled = false;
                    zoomControl.classList.remove("is-disabled");
                    zoomControl.title = "Приближение камеры";
                }
            } catch (error) {
                console.warn("Camera controls unavailable", error);
            }
        }

        async function refreshCameraChoices() {
            if (!navigator.mediaDevices?.enumerateDevices || !cameraRunning) {
                return;
            }
            try {
                const cameras = (await navigator.mediaDevices.enumerateDevices())
                    .filter((device) => device.kind === "videoinput" && device.deviceId);
                cameraSelect.replaceChildren();
                if (cameras.length < 2) {
                    cameraSelect.hidden = true;
                    return;
                }
                const activeId = scanner.getRunningTrackSettings().deviceId;
                cameras.forEach((device, index) => {
                    const name = /back|rear|environment/i.test(device.label)
                        ? `Задняя камера ${index + 1}`
                        : /front|user/i.test(device.label)
                            ? `Фронтальная камера ${index + 1}`
                            : `Камера ${index + 1}`;
                    const option = new Option(name, device.deviceId);
                    cameraSelect.add(option);
                });
                cameraSelect.value = activeId || cameras[0].deviceId;
                cameraSelect.hidden = false;
            } catch (error) {
                console.warn("Camera list unavailable", error);
            }
        }

        function stopCamera() {
            return queueCameraAction(async () => {
                await settleZoom();
                if (cameraRunning) {
                    cameraRunning = false;
                    await scanner.stop();
                }
                scanner.clear();
                cameraFrame.classList.remove("is-active");
                resetCameraControls();
                cameraButton.title = "Включить камеру";
                cameraButton.setAttribute("aria-label", cameraButton.title);
            });
        }

        function startCamera(cameraId = null) {
            return queueCameraAction(async () => {
                if (isSubmitting) {
                    return;
                }
                cameraButton.disabled = true;
                photoButton.disabled = true;
                setStatus("loading", "Подключаем камеру...");
                try {
                    await settleZoom();
                    if (cameraRunning) {
                        cameraRunning = false;
                        await scanner.stop();
                    }
                    scanner.clear();
                    const videoConstraints = cameraId
                        ? { deviceId: { exact: cameraId }, width: { ideal: 1280 }, height: { ideal: 960 } }
                        : { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 960 } };
                    await scanner.start(
                        cameraId || { facingMode: "environment" },
                        { fps: 12, videoConstraints },
                        onScanSuccess,
                        () => {}
                    );
                    cameraRunning = true;
                    cameraFrame.classList.add("is-active");
                    cameraButton.title = "Перезапустить камеру";
                    cameraButton.setAttribute("aria-label", cameraButton.title);
                    setStatus("", "");
                    configureCameraControls();
                    refreshCameraChoices();
                } catch (error) {
                    console.error("Camera start failed", error);
                    cameraFrame.classList.remove("is-active");
                    resetCameraControls();
                    setStatus("error", "Не удалось открыть камеру. Проверьте доступ или загрузите фото.");
                } finally {
                    cameraButton.disabled = false;
                    photoButton.disabled = false;
                }
            });
        }

        async function settleZoom() {
            pendingZoom = null;
            pinchStart = null;
            zoomSlider.disabled = true;
            if (zoomTask) {
                await zoomTask;
            }
        }

        function requestZoom(value) {
            if (!cameraRunning || zoomSlider.disabled) {
                return;
            }
            const desired = Math.min(Number(zoomSlider.max), Math.max(Number(zoomSlider.min), Number(value)));
            if (!Number.isFinite(desired)) {
                return;
            }
            zoomSlider.value = String(desired);
            pendingZoom = Number(zoomSlider.value);
            zoomValue.textContent = `${pendingZoom.toFixed(1)}×`;
            if (!zoomTask) {
                // Apply one camera constraint at a time, keeping the latest gesture value.
                zoomTask = (async () => {
                    while (pendingZoom !== null && cameraRunning && !zoomSlider.disabled) {
                        const nextZoom = pendingZoom;
                        pendingZoom = null;
                        if (nextZoom === currentZoom) {
                            continue;
                        }
                        try {
                            await scanner.applyVideoConstraints({ advanced: [{ zoom: nextZoom }] });
                            currentZoom = nextZoom;
                        } catch (error) {
                            console.warn("Zoom unavailable", error);
                            if (pendingZoom === null && cameraRunning && !zoomSlider.disabled) {
                                zoomSlider.value = String(currentZoom);
                                zoomValue.textContent = `${currentZoom.toFixed(1)}×`;
                                setStatus("error", "Камера не смогла изменить приближение");
                            }
                        }
                    }
                })().finally(() => {
                    zoomTask = null;
                    if (pendingZoom !== null && cameraRunning && !zoomSlider.disabled) {
                        requestZoom(pendingZoom);
                    }
                });
            }
            return zoomTask;
        }

        function touchDistance(touches) {
            return Math.hypot(
                touches[0].clientX - touches[1].clientX,
                touches[0].clientY - touches[1].clientY
            );
        }

        scanner = new Html5Qrcode("reader", {
            formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
            useBarCodeDetectorIfSupported: true,
        });

        cameraButton.addEventListener("click", () => startCamera(cameraSelect.hidden ? null : cameraSelect.value));
        cameraSelect.addEventListener("change", () => startCamera(cameraSelect.value));
        photoButton.addEventListener("click", () => photoInput.click());
        photoInput.addEventListener("change", async () => {
            const file = photoInput.files?.[0];
            photoInput.value = "";
            if (!file || isSubmitting) {
                return;
            }
            photoButton.disabled = true;
            cameraPlaceholder.lastElementChild.textContent = "Читаем фото...";
            setStatus("loading", "Читаем QR-код с фото...");
            let photoError = null;
            try {
                await stopCamera();
                const decodedText = await scanner.scanFile(file, false);
                await onScanSuccess(decodedText);
                if (!isSubmitting) {
                    photoError = "На фото нет кода отметки Пульс";
                }
            } catch (error) {
                console.warn("Photo scan failed", error);
                photoError = "Не удалось прочитать QR-код с фото";
            } finally {
                cameraPlaceholder.lastElementChild.textContent = "Камера ещё не включена";
                photoButton.disabled = false;
                if (!isSubmitting) {
                    await startCamera(cameraSelect.hidden ? null : cameraSelect.value);
                    if (photoError) {
                        setStatus("error", photoError);
                    }
                }
            }
        });
        zoomSlider.addEventListener("input", () => requestZoom(zoomSlider.value));
        zoomSlider.addEventListener("change", () => requestZoom(zoomSlider.value));
        cameraFrame.addEventListener("touchstart", (event) => {
            if (event.touches.length !== 2 || !cameraRunning || zoomSlider.disabled) {
                return;
            }
            const distance = touchDistance(event.touches);
            if (distance > 0) {
                pinchStart = { distance, zoom: Number(zoomSlider.value) };
                event.preventDefault();
            }
        }, { passive: false });
        cameraFrame.addEventListener("touchmove", (event) => {
            if (!pinchStart || event.touches.length !== 2 || !cameraRunning || zoomSlider.disabled) {
                return;
            }
            event.preventDefault();
            requestZoom(pinchStart.zoom * touchDistance(event.touches) / pinchStart.distance);
        }, { passive: false });
        cameraFrame.addEventListener("touchend", (event) => {
            if (event.touches.length < 2) {
                pinchStart = null;
            }
        });
        cameraFrame.addEventListener("touchcancel", () => { pinchStart = null; });

        startCamera();
    </script>
</body>

</html>
