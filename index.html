<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR-Code Scanner</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>
    <div id="reader" style="width: 100%; height: 100vh; background: white; touch-action: none;"></div>
</body>

<style>
    #html5-qrcode-button-camera-permission {
        background-color: transparent;
        border: 2px solid #000;
        color: #000;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s, color 0.3s;
    }

    #html5-qrcode-button-camera-permission:hover {
        background-color: #000;
        color: #fff;
    }

    #html5-qrcode-anchor-scan-type-change {
        display: none;
    }
</style>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    const studentsIdsRaw = new URLSearchParams(window.location.search).get("students_ids");
    const studentIds = studentsIdsRaw
        ? studentsIdsRaw.split(",").map((id) => Number(id.trim())).filter((id) => Number.isFinite(id))
        : [];

    let isSubmitting = false;

    async function onScanSuccess(decodedText, decodedResult) {
        if (isSubmitting) {
            return;
        }

        console.log(`Code matched = ${decodedText}`, decodedResult);
        if (!decodedText.includes('pulse.mirea.ru/lessons/visiting-logs/selfapprove?token=')) {
            return;
        }

        isSubmitting = true;
        const token = decodedText.split('=')[1];

        try {
            try {
                await html5QrcodeScanner.clear();
            } catch (clearError) {
                console.warn('Failed to stop scanner before sending request', clearError);
            }

            const response = await fetch('https://mirea-bot.latyshov.space/api/attendance/approve', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    token: token,
                    student_ids: studentIds,
                    shuffle: true,
                }),
            });

            if (!response.ok) {
                throw new Error(`Attendance API request failed with status ${response.status}`);
            }

            const responseData = await response.json();
            const resultItems = Array.isArray(responseData?.items) ? responseData.items : [];

            tg.sendData(JSON.stringify(resultItems));
        } catch (error) {
            console.error('Failed to send attendance request', error);
            tg.sendData(JSON.stringify([]));
        } finally {
            tg.close();
        }
    }

    let html5QrcodeScanner = new Html5QrcodeScanner(
        "reader",
        {
            fps: 60,
            qrbox: { width: 250, height: 250 },
            videoConstraints: {
                facingMode: "environment",
                zoom: 1
            },
            rememberLastUsedCamera: true,
        },
        /* verbose= */ false
    );

    let initialDistance = null;
    let zoom = 10;

    function getDistance(touch1, touch2) {
        return Math.sqrt(Math.pow(touch2.pageX - touch1.pageX, 2) + Math.pow(touch2.pageY - touch1.pageY, 2));
    }

    document.addEventListener('touchstart', function (e) {
        if (e.touches.length === 2) {
            initialDistance = getDistance(e.touches[0], e.touches[1]);
        }
    });

    document.addEventListener('touchmove', function (e) {
        if (e.touches.length === 2 && initialDistance) {
            const newDistance = getDistance(e.touches[0], e.touches[1]);

            if (newDistance > initialDistance && zoom < 100) {
                zoom = Math.min(100, zoom + 1);
            } else if (newDistance < initialDistance && zoom > 10) {
                zoom = Math.max(10, zoom - 1);
            }

            html5QrcodeScanner.applyVideoConstraints({ zoom: Math.round(zoom / 10) });
            initialDistance = newDistance;
        }
    });

    html5QrcodeScanner.render(onScanSuccess);
</script>

</html>
